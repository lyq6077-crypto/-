<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Rock Paper Scissors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            overflow: hidden; /* Prevent body scroll, handle internally */
        }
        
        h1, .rpg-title {
            font-family: 'Cinzel', serif;
        }

        /* Custom Scrollbar for Battle Log */
        .battle-log-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .battle-log-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5); 
            border-radius: 4px;
        }
        .battle-log-scroll::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .battle-log-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
        }

        /* Equipment Radio Card Styles */
        input[type="radio"]:checked + div {
            border-color: #fbbf24; /* amber-400 */
            background-color: rgba(251, 191, 36, 0.1);
            animation: pulse-glow 2s infinite;
        }
        
        .action-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.05);
            filter: brightness(1.1);
        }
        .action-btn:active:not(:disabled) {
            transform: translateY(2px) scale(0.95);
        }
        
        .item-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-2 sm:p-4">

    <!-- Main App Container -->
    <div id="app" class="w-full max-w-3xl h-full max-h-[850px] bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden relative flex flex-col">
        
        <!-- ================= START SCREEN ================= -->
        <div id="start-screen" class="absolute inset-0 z-20 bg-slate-800 flex flex-col items-center justify-center p-6 overflow-y-auto animate-fade-in">
            <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-orange-500 mb-2 text-center drop-shadow-sm">
                RPS: The Grand Duel
            </h1>
            <p class="text-slate-400 mb-8 text-center text-sm sm:text-base">First to 5 wins claims the title of Grandmaster.</p>

            <div class="w-full max-w-xl space-y-6">
                <!-- Player Name -->
                <div>
                    <label class="block text-amber-400 font-semibold mb-2 text-sm uppercase tracking-wider" for="playerName">Adventurer Name</label>
                    <input type="text" id="playerName" placeholder="Enter your name..." 
                           class="w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder-slate-600">
                </div>

                <!-- Equipment Selection -->
                <div>
                    <label class="block text-amber-400 font-semibold mb-3 text-sm uppercase tracking-wider">Choose Starting Equipment</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Equip 1 -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="equipment" value="1" class="sr-only" checked>
                            <div class="border-2 border-slate-600 rounded-xl p-4 h-full transition hover:border-slate-500 bg-slate-700/30 flex flex-col justify-center">
                                <div class="text-xl mb-1">👑 Golden Keyboard</div>
                                <div class="text-amber-300 font-bold text-xs uppercase">Item Master</div>
                                <div class="text-slate-400 text-xs mt-1 leading-tight">All item starting amounts +1 (Total 3 each)</div>
                            </div>
                        </label>
                        <!-- Equip 2 -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="equipment" value="2" class="sr-only">
                            <div class="border-2 border-slate-600 rounded-xl p-4 h-full transition hover:border-slate-500 bg-slate-700/30 flex flex-col justify-center">
                                <div class="text-xl mb-1">🪄 Magic Wand</div>
                                <div class="text-blue-400 font-bold text-xs uppercase">Magic Shield</div>
                                <div class="text-slate-400 text-xs mt-1 leading-tight">Blocks 1 loss automatically (One-time use)</div>
                            </div>
                        </label>
                        <!-- Equip 3 -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="equipment" value="3" class="sr-only">
                            <div class="border-2 border-slate-600 rounded-xl p-4 h-full transition hover:border-slate-500 bg-slate-700/30 flex flex-col justify-center">
                                <div class="text-xl mb-1">⚔️ Holy Sword</div>
                                <div class="text-yellow-400 font-bold text-xs uppercase">Holy Strike</div>
                                <div class="text-slate-400 text-xs mt-1 leading-tight">50% chance to instantly win on a tie</div>
                            </div>
                        </label>
                        <!-- Equip 4 -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="equipment" value="4" class="sr-only">
                            <div class="border-2 border-slate-600 rounded-xl p-4 h-full transition hover:border-slate-500 bg-slate-700/30 flex flex-col justify-center">
                                <div class="text-xl mb-1">🛡️ Scrap Shield</div>
                                <div class="text-emerald-400 font-bold text-xs uppercase">Sturdy Defense</div>
                                <div class="text-slate-400 text-xs mt-1 leading-tight">Deducts 1 win when computer reaches 4 wins (One-time use)</div>
                            </div>
                        </label>
                    </div>
                </div>

                <button onclick="startGame()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold py-4 rounded-xl shadow-[0_4px_15px_rgba(245,158,11,0.4)] transform transition active:scale-95 text-lg uppercase tracking-wider">
                    Begin Adventure
                </button>
            </div>
        </div>

        <!-- ================= MAIN GAME SCREEN ================= -->
        <div id="game-screen" class="hidden flex-col h-full opacity-0 transition-opacity duration-500">
            
            <!-- Header: Stats & Score -->
            <div class="bg-slate-900 p-4 sm:p-6 border-b border-slate-700 flex justify-between items-center shrink-0 shadow-md z-10">
                <div class="flex-1 flex flex-col">
                    <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Adventurer</div>
                    <div id="display-name" class="font-bold text-lg sm:text-xl text-amber-400 truncate">Player</div>
                    <div id="display-equip" class="text-xs sm:text-sm text-slate-300 truncate bg-slate-800 w-fit px-2 py-0.5 rounded border border-slate-600 mt-1">Equipment</div>
                </div>
                
                <div class="flex-none flex justify-center items-center gap-3 sm:gap-6 px-4">
                    <div class="flex flex-col items-center">
                        <div class="text-4xl sm:text-5xl font-black text-blue-400 drop-shadow-md" id="score-player">0</div>
                        <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-1">You</div>
                    </div>
                    <div class="text-xl font-black text-slate-600 italic">VS</div>
                    <div class="flex flex-col items-center">
                        <div class="text-4xl sm:text-5xl font-black text-red-400 drop-shadow-md" id="score-computer">0</div>
                        <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-1">CPU</div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col items-end text-right">
                    <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Status</div>
                    <div class="font-bold text-lg sm:text-xl text-white">Round <span id="round-number" class="text-amber-400">1</span></div>
                </div>
            </div>

            <!-- Middle: Battle Log -->
            <div id="battle-log" class="flex-1 p-4 sm:p-6 overflow-y-auto battle-log-scroll bg-slate-800/50 text-sm sm:text-base leading-relaxed flex flex-col gap-2 relative">
                <!-- Log entries will be injected here -->
            </div>

            <!-- Bottom: Interaction Area -->
            <div class="bg-slate-900 p-4 sm:p-6 border-t border-slate-700 shrink-0 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)] z-10">
                
                <!-- Items -->
                <div class="mb-5 max-w-xl mx-auto">
                    <div class="text-[10px] text-amber-400 font-bold mb-2 uppercase tracking-widest text-center">🎒 Inventory (1 item per round)</div>
                    <div class="flex justify-center gap-2 sm:gap-4">
                        <button id="btn-item-1" onclick="useItem('xray')" class="item-btn flex-1 bg-slate-800 border border-slate-600 hover:border-purple-400 rounded-xl p-2 transition flex flex-col items-center relative overflow-hidden group">
                            <div class="absolute inset-0 bg-purple-500/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                            <span class="text-2xl sm:text-3xl mb-1 relative z-10 drop-shadow-md group-hover:scale-110 transition-transform">🔮</span>
                            <span class="text-[10px] sm:text-xs font-bold text-purple-300 relative z-10">X-Ray</span>
                            <span id="count-xray" class="text-[10px] text-slate-300 bg-slate-950/50 px-2 py-0.5 rounded-full mt-1 border border-slate-700 relative z-10">x2</span>
                        </button>
                        <button id="btn-item-2" onclick="useItem('jammer')" class="item-btn flex-1 bg-slate-800 border border-slate-600 hover:border-blue-400 rounded-xl p-2 transition flex flex-col items-center relative overflow-hidden group">
                            <div class="absolute inset-0 bg-blue-500/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                            <span class="text-2xl sm:text-3xl mb-1 relative z-10 drop-shadow-md group-hover:scale-110 transition-transform">⚡</span>
                            <span class="text-[10px] sm:text-xs font-bold text-blue-300 relative z-10">Jammer</span>
                            <span id="count-jammer" class="text-[10px] text-slate-300 bg-slate-950/50 px-2 py-0.5 rounded-full mt-1 border border-slate-700 relative z-10">x2</span>
                        </button>
                        <button id="btn-item-3" onclick="useItem('double')" class="item-btn flex-1 bg-slate-800 border border-slate-600 hover:border-green-400 rounded-xl p-2 transition flex flex-col items-center relative overflow-hidden group">
                            <div class="absolute inset-0 bg-green-500/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                            <span class="text-2xl sm:text-3xl mb-1 relative z-10 drop-shadow-md group-hover:scale-110 transition-transform">🧪</span>
                            <span class="text-[10px] sm:text-xs font-bold text-green-300 relative z-10">Double Potion</span>
                            <span id="count-double" class="text-[10px] text-slate-300 bg-slate-950/50 px-2 py-0.5 rounded-full mt-1 border border-slate-700 relative z-10">x2</span>
                        </button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex justify-center gap-4 sm:gap-8">
                    <button onclick="playRound('Rock')" class="action-btn w-20 h-20 sm:w-28 sm:h-28 bg-gradient-to-b from-stone-500 to-stone-700 rounded-2xl flex flex-col items-center justify-center shadow-[0_8px_0_#44403c,0_15px_20px_rgba(0,0,0,0.4)] hover:shadow-[0_6px_0_#44403c,0_10px_15px_rgba(0,0,0,0.4)] active:shadow-[0_0px_0_#44403c,0_0px_0px_rgba(0,0,0,0.4)] border border-stone-400/30 disabled:opacity-50">
                        <span class="text-4xl sm:text-5xl drop-shadow-lg">✊</span>
                        <span class="text-[10px] font-bold mt-1 text-stone-200 tracking-wider">ROCK</span>
                    </button>
                    <button onclick="playRound('Paper')" class="action-btn w-20 h-20 sm:w-28 sm:h-28 bg-gradient-to-b from-blue-500 to-blue-700 rounded-2xl flex flex-col items-center justify-center shadow-[0_8px_0_#1e3a8a,0_15px_20px_rgba(0,0,0,0.4)] hover:shadow-[0_6px_0_#1e3a8a,0_10px_15px_rgba(0,0,0,0.4)] active:shadow-[0_0px_0_#1e3a8a,0_0px_0px_rgba(0,0,0,0.4)] border border-blue-400/30 disabled:opacity-50">
                        <span class="text-4xl sm:text-5xl drop-shadow-lg">✋</span>
                        <span class="text-[10px] font-bold mt-1 text-blue-200 tracking-wider">PAPER</span>
                    </button>
                    <button onclick="playRound('Scissors')" class="action-btn w-20 h-20 sm:w-28 sm:h-28 bg-gradient-to-b from-red-500 to-red-700 rounded-2xl flex flex-col items-center justify-center shadow-[0_8px_0_#7f1d1d,0_15px_20px_rgba(0,0,0,0.4)] hover:shadow-[0_6px_0_#7f1d1d,0_10px_15px_rgba(0,0,0,0.4)] active:shadow-[0_0px_0_#7f1d1d,0_0px_0px_rgba(0,0,0,0.4)] border border-red-400/30 disabled:opacity-50">
                        <span class="text-4xl sm:text-5xl drop-shadow-lg">✌️</span>
                        <span class="text-[10px] font-bold mt-1 text-red-200 tracking-wider">SCISSORS</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= MODAL / GAME OVER SCREEN ================= -->
        <div id="modal-overlay" class="hidden absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-slate-800 border-2 border-slate-600 rounded-2xl p-8 max-w-md w-full shadow-2xl flex flex-col items-center text-center animate-fade-in relative overflow-hidden">
                <!-- Decorative glow -->
                <div id="modal-glow" class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-900/50 pointer-events-none"></div>
                
                <h2 id="modal-title" class="rpg-title text-4xl sm:text-5xl font-black mb-4 z-10 drop-shadow-lg">Result</h2>
                <p id="modal-desc" class="text-slate-300 mb-6 z-10 leading-relaxed"></p>
                
                <div class="flex items-center justify-center gap-6 mb-8 z-10 bg-slate-900/80 px-6 py-4 rounded-xl border border-slate-700">
                    <div class="text-center">
                        <div class="text-sm text-slate-400 uppercase font-bold">You</div>
                        <div id="modal-score-player" class="text-4xl font-black text-blue-400">0</div>
                    </div>
                    <div class="text-2xl font-black text-slate-600">:</div>
                    <div class="text-center">
                        <div class="text-sm text-slate-400 uppercase font-bold">CPU</div>
                        <div id="modal-score-computer" class="text-4xl font-black text-red-400">0</div>
                    </div>
                </div>
                
                <button onclick="resetGame()" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95 text-lg uppercase tracking-wider z-10">
                    Play Again
                </button>
            </div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Constants & State
        const OPTIONS = ["Rock", "Paper", "Scissors"];
        const EMOJI = { "Rock": "✊", "Paper": "✋", "Scissors": "✌️" };
        
        let state = {
            name: "Hero",
            equipId: "1",
            equipName: "",
            playerWins: 0,
            computerWins: 0,
            roundNum: 1,
            items: { xray: 2, jammer: 2, double: 2 },
            
            // Equipment specific tracking
            wandShieldReady: false,
            scrapShieldReady: false,
            
            // Round specific
            nextComputerChoice: "",
            itemUsedThisRound: false,
            doublePointsActive: false,
            isGameOver: false
        };

        // DOM Elements
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            modal: document.getElementById('modal-overlay')
        };
        const logContainer = document.getElementById('battle-log');

        // Setup & Initialization
        function startGame() {
            const nameInput = document.getElementById('playerName').value.trim();
            state.name = nameInput || "Nameless Hero";
            
            const equipRadios = document.getElementsByName('equipment');
            for(let radio of equipRadios) {
                if(radio.checked) {
                    state.equipId = radio.value;
                    break;
                }
            }

            // Init Equipment Logic
            state.items = { xray: 2, jammer: 2, double: 2 };
            state.wandShieldReady = false;
            state.scrapShieldReady = false;
            state.doublePointsActive = false;
            state.itemUsedThisRound = false;
            state.isGameOver = false;

            if (state.equipId === "1") {
                state.equipName = "👑 Golden Keyboard";
                state.items = { xray: 3, jammer: 3, double: 3 };
            } else if (state.equipId === "2") {
                state.equipName = "🪄 Magic Wand";
                state.wandShieldReady = true;
            } else if (state.equipId === "3") {
                state.equipName = "⚔️ Holy Sword";
            } else if (state.equipId === "4") {
                state.equipName = "🛡️ Scrap Shield";
                state.scrapShieldReady = true;
            }

            // Reset scores & UI
            state.playerWins = 0;
            state.computerWins = 0;
            state.roundNum = 1;
            logContainer.innerHTML = '';
            
            document.getElementById('display-name').innerText = state.name;
            document.getElementById('display-equip').innerText = state.equipName;
            
            updateUI();
            
            // Intro logs
            appendLog(`System: Welcome, brave adventurer [${state.name}]!`, 'text-amber-400 font-black text-lg pb-1');
            appendLog(`Equipped: ${state.equipName}. Let the duel begin.`, 'text-slate-300 italic pb-2 border-b border-slate-700/50');
            
            prepareNextRound();

            // Transition
            screens.start.classList.add('hidden');
            screens.game.classList.remove('hidden');
            // Small delay for fade in
            setTimeout(() => {
                screens.game.classList.remove('opacity-0');
            }, 50);
        }

        function rollComputerChoice() {
            return OPTIONS[Math.floor(Math.random() * OPTIONS.length)];
        }

        function prepareNextRound() {
            if(state.isGameOver) return;
            state.nextComputerChoice = rollComputerChoice();
            state.itemUsedThisRound = false;
            state.doublePointsActive = false;
            appendLog(`--- ROUND ${state.roundNum} ---`, 'text-slate-400 mt-3 font-black tracking-widest text-xs');
            updateItemButtons();
            toggleActionButtons(false);
        }

        // Item Logic
        function useItem(itemType) {
            if (state.itemUsedThisRound || state.isGameOver) return;
            if (state.items[itemType] <= 0) return;

            state.items[itemType]--;
            state.itemUsedThisRound = true;
            updateItemButtons();

            if (itemType === 'xray') {
                appendLog(`🔮 [X-Ray Glasses] activated! You foresee the computer will play: ${EMOJI[state.nextComputerChoice]} ${state.nextComputerChoice}!`, "text-purple-300 bg-purple-900/20 p-3 rounded-lg border border-purple-700/30");
            } else if (itemType === 'jammer') {
                state.nextComputerChoice = "Rock";
                appendLog(`⚡ [Jammer] activated! Enemy systems glitch. They are forced to play: ✊ Rock!`, "text-blue-300 bg-blue-900/20 p-3 rounded-lg border border-blue-700/30");
            } else if (itemType === 'double') {
                state.doublePointsActive = true;
                appendLog(`🧪 [Double Potion] activated! If you win this round, you earn +2 Wins!`, "text-green-300 bg-green-900/20 p-3 rounded-lg border border-green-700/30");
            }
        }

        // Gameplay Logic
        function playRound(playerChoice) {
            if(state.isGameOver) return;
            
            const compChoice = state.nextComputerChoice;
            toggleActionButtons(true); // Disable while calculating

            // Create a small visual delay for dramatic effect
            const row = document.createElement('div');
            row.className = "flex items-center gap-3 mt-2 mb-1 p-2 rounded bg-slate-900/40 border border-slate-700/50 animate-fade-in";
            row.innerHTML = `
                <div class="flex-1 text-right text-blue-300 font-bold">${playerChoice} ${EMOJI[playerChoice]}</div>
                <div class="text-slate-500 font-black italic text-xs">VS</div>
                <div class="flex-1 text-left text-red-300 font-bold">${EMOJI[compChoice]} ${compChoice}</div>
            `;
            logContainer.appendChild(row);
            logContainer.scrollTop = logContainer.scrollHeight;

            let result = ""; // 'win', 'lose', 'tie'

            if (playerChoice === compChoice) {
                result = 'tie';
            } else if (
                (playerChoice === "Rock" && compChoice === "Scissors") ||
                (playerChoice === "Paper" && compChoice === "Rock") ||
                (playerChoice === "Scissors" && compChoice === "Paper")
            ) {
                result = 'win';
            } else {
                result = 'lose';
            }

            setTimeout(() => {
                evaluateRound(result);
            }, 400); // 400ms delay for suspense
        }

        function evaluateRound(result) {
            if (result === 'tie') {
                if (state.equipId === "3" && Math.random() < 0.5) {
                    const pts = state.doublePointsActive ? 2 : 1;
                    state.playerWins += pts;
                    appendLog(`✨ [Holy Sword] triggers [Holy Strike]! The tie is broken in your favor! (+${pts} Win)`, "text-yellow-400 font-bold bg-yellow-900/30 p-2 rounded border border-yellow-700/50");
                } else {
                    appendLog("Draw! Clashing weapons yield no points.", "text-slate-400");
                }
            } 
            else if (result === 'win') {
                const pts = state.doublePointsActive ? 2 : 1;
                state.playerWins += pts;
                appendLog(`🎉 Victory! You win this round! (+${pts} Win)`, "text-green-400 font-bold");
            } 
            else if (result === 'lose') {
                if (state.wandShieldReady) {
                    state.wandShieldReady = false; 
                    appendLog(`🪄 [Magic Wand] triggers [Magic Shield]! The enemy's attack is completely nullified!`, "text-cyan-300 font-bold bg-cyan-900/30 p-2 rounded border border-cyan-700/50");
                } else {
                    state.computerWins += 1;
                    appendLog(`💥 Defeat! The computer takes the round! (+1 CPU Win)`, "text-red-400 font-bold");

                    // Scrap Shield Check
                    if (state.equipId === "4" && state.computerWins === 4 && state.scrapShieldReady) {
                        state.scrapShieldReady = false;
                        state.computerWins -= 1;
                        appendLog(`🛡️ [Scrap Shield] triggers [Sturdy Defense]! The enemy's 4th win is shattered! (CPU score reduced to 3)`, "text-emerald-400 font-bold bg-emerald-900/30 p-2 rounded border border-emerald-700/50");
                    }
                }
            }

            updateUI();
            
            if (state.playerWins >= 5 || state.computerWins >= 5) {
                state.isGameOver = true;
                setTimeout(showEndGame, 800);
            } else {
                state.roundNum++;
                prepareNextRound();
            }
        }

        // UI Updates
        function updateUI() {
            document.getElementById('score-player').innerText = state.playerWins;
            document.getElementById('score-computer').innerText = state.computerWins;
            document.getElementById('round-number').innerText = state.roundNum;
            updateItemButtons();
        }

        function updateItemButtons() {
            const uiItems = [
                { id: 'xray', countId: 'count-xray', btnId: 'btn-item-1' },
                { id: 'jammer', countId: 'count-jammer', btnId: 'btn-item-2' },
                { id: 'double', countId: 'count-double', btnId: 'btn-item-3' }
            ];

            uiItems.forEach(item => {
                const count = state.items[item.id];
                document.getElementById(item.countId).innerText = `x${count}`;
                const btn = document.getElementById(item.btnId);
                btn.disabled = (count <= 0 || state.itemUsedThisRound || state.isGameOver);
            });
        }

        function toggleActionButtons(disable) {
            const btns = document.querySelectorAll('.action-btn');
            btns.forEach(b => b.disabled = disable);
        }

        // Logging System
        function appendLog(text, className = "") {
            const el = document.createElement('div');
            el.className = `log-entry animate-fade-in ${className}`;
            el.innerHTML = text;
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // End Game Modal
        function showEndGame() {
            screens.modal.classList.remove('hidden');

            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const glow = document.getElementById('modal-glow');
            
            document.getElementById('modal-score-player').innerText = state.playerWins;
            document.getElementById('modal-score-computer').innerText = state.computerWins;

            if (state.playerWins >= 5) {
                title.innerText = "VICTORY";
                title.className = "rpg-title text-4xl sm:text-5xl font-black mb-4 z-10 drop-shadow-[0_0_15px_rgba(250,204,21,0.6)] text-yellow-400";
                desc.innerHTML = `Congratulations, <strong>${state.name}</strong>! Wielding the <strong>${state.equipName}</strong>, you have conquered the Grand Duel!`;
                glow.className = "absolute inset-0 bg-gradient-to-t from-yellow-900/40 to-transparent pointer-events-none";
            } else {
                title.innerText = "DEFEAT";
                title.className = "rpg-title text-4xl sm:text-5xl font-black mb-4 z-10 drop-shadow-[0_0_15px_rgba(220,38,38,0.6)] text-red-500";
                desc.innerHTML = `The computer proved too strong this time. Dust yourself off and try again.`;
                glow.className = "absolute inset-0 bg-gradient-to-t from-red-900/40 to-transparent pointer-events-none";
            }
        }

        // Reset
        function resetGame() {
            screens.modal.classList.add('hidden');
            screens.game.classList.add('opacity-0');
            
            setTimeout(() => {
                screens.game.classList.add('hidden');
                screens.start.classList.remove('hidden');
            }, 300);
        }
    </script>
</body>
</html>
